<!DOCTYPE html><html><head>
		<link href="https://fonts.googleapis.com/css?family=Roboto+Slab" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="style.css">
		<meta charset="utf-8">

  </head>
  <body>
      <div class="startButton">
            <button onclick="runSketch(wordSketch);">Start / Reset
            </button>
        </div>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.0/p5.min.js"
            integrity="sha512-tGZFF1kxT/c9C+kv77mKkZ9Ww1VyU8TMX6HLUSzbPrDLuptbiRFBfti8A33ip+BBIHYUsybuZD9OKLmIqdLmaQ=="
            crossorigin="anonymous"></script>
            <script src="rita-full.min.js"></script>
            <script src="p5.min.js"></script>
            <script src="p5.dom.min.js"></script>
            <script src="p5.sound.min.js"></script>
            <script src="p5.speech.js"></script>
            <script src="sketch.js"></script>
            
         <div id="sketchContainer"></div>
    
            <script>
                // This is the sketch launcher
                var p5Sketch;

                function runSketch(sketch) 
                {
                    if (typeof p5Sketch !== 'undefined') 
                    {
                        p5Sketch.remove();
                    }

                    p5Sketch = new p5(sketch, "sketchContainer");
                }
        </script>

</body></html>
